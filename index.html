<!DOCTYPE html>
<html>
  <head>
    <title>ReosTech</title>
    <link rel="icon" href="reo.png">
  </head>
  <style>
    h1{
      font-family:Sans Serif;
    }
    .cta-btn {
            display: inline-block;
            background-color: #2563eb;
            color: white;
            padding: 0.75rem 2rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.2);
            transition: background-color 0.2s, transform 0.1s;
        }

        .cta-btn:hover {
            background-color: #1d4ed8;
        }

        .cta-btn:active {
            transform: scale(0.98);
        }
    p{
      font-family:Sans Serif;
    }
  </style>
  <body>
  <h1 style="text-align:center;">ReosTech</h1>
   <p>Hi,</p> 
  <div style="text-align:center;">
  <button class="cta-btn" onclick="window.location.href='https://reostech.pagekite.me'">Visit Reos</button>
  </div>
  <div id="status-container">
  Checking site status... <span id="status-dot" style="display:inline-block; width:10px; height:10px; border-radius:50%; background:#ccc;"></span>
</div>

<script>
  // Note: Standard fetch() to another domain might trigger CORS blocks. 
  // We use a free, open CORS proxy/ping API to check the website.
  const targetUrl = 'https://reostech.pagekite.me'; 
  
  async function checkSiteStatus() {
    const dot = document.getElementById('status-dot');
    const container = document.getElementById('status-container');
    
    try {
      // Pinging a free network tool API to check the header status
      const response = await fetch(`https://allorigins.win{encodeURIComponent(targetUrl)}`);
      
      if (response.ok) {
        dot.style.background = '#2ecc71'; // Green
        container.innerHTML = 'System Operational ' + dot.outerHTML;
      } else {
        throw new Error('Down');
      }
    } catch (error) {
      dot.style.background = '#e74c3c'; // Red
      container.innerHTML = 'Site Offline ' + dot.outerHTML;
    }
  }

  // Run the check on page load
  checkSiteStatus();
</script>
  </body>
</html>
